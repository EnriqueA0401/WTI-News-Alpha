# Construcción de eventos (docs/plans/FASE_03.md). Parámetros de diseño técnico de la línea base
# (no son horizontes, etiquetas, costes ni timestamps): se revisan con la muestra auditada de G2
# y cualquier cambio es una versión nueva (ADR-029).
# events-v2 (2026-10-17): correcciones de la revisión adversarial de F3 (ADR-030).
# events-v3 (2026-10-17): solo las 5 familias con precisión aceptable en G2 generan eventos (ADR-032).
version: events-v3
news_version: gdelt-news-v2
title_dedup_window_hours:
  value: 48
  status: approved
  source_ref: "ADR-029: re-publicación = mismo título normalizado con huecos <= 48 h"
event_gap_hours:
  value: 24
  status: approved
  source_ref: "ADR-029: un evento se cierra tras 24 h sin artículos elegibles de su clave (familia, país)"
eligible_relevance:
  value: [direct]
  status: approved
  source_ref: "ADR-029: solo artículos directamente relevantes abren o alimentan eventos"
event_max_span_hours:
  value: 72
  status: approved
  source_ref: "ADR-030: un evento dura como máximo 72 h desde su primer artículo (rachas que no se cierran)"
families_without_events:
  value: [other, market_report, opinion, company, demand_macro, logistics, rates_usd, supply_disruption]
  status: approved
  source_ref: "ADR-030 (other, market_report, opinion: no son acontecimientos) y ADR-032 (precisión baja en G2); tampoco el país XX"

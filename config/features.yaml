# Features point-in-time (docs/plans/FASE_04.md). Parámetros de diseño técnico (no son horizontes
# de etiqueta, costes ni timestamps de fuentes); cualquier cambio es una versión nueva.
version: feat-v1
inputs:
  price: dwx-xti-m1-v3
  events: events-v3
  wpsr: eia-wpsr-v2
  cot: cftc-cot-v2
  fred: fred-alfred-v2
step_minutes:
  value: 5
  status: approved
  source_ref: "PROTOCOL A4 (ADR-009): rejilla fija cada 5 min dentro de sesión"

  status: approved
  source_ref: "Documento §7: volatilidad realizada y rango; ventana de 60 min"
news_windows_minutes:
  value: [15, 60, 240]
  status: approved
  source_ref: "Documento §7 (menú de noticias): conteos 15 min / 1 h / 4 h"

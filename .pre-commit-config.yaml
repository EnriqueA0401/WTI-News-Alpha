# Hooks locales: usan las versiones fijadas en uv.lock (sin descargas extra).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict (src)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: forbid-env-files
        name: no commitear .env
        entry: ".env files must never be committed"
        language: fail
        files: '(^|/)\.env(\..*)?$'
      - id: forbid-data-files
        name: no commitear data/
        entry: "data/ must never be committed"
        language: fail
        files: '^data/(?!README\.md$)'
